[project]
name = "webrecon"
version = "0.1.0"
description = "Full-featured async web crawler & recon toolkit"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "dnspython>=2.4",
]

[project.scripts]
webrecon = "webrecon.cli:main"
servicescan = "servicescan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["webrecon", "servicescan"]
