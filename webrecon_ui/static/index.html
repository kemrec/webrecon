<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webrecon-ui</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a323c;
    --fg:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --accent2:#1f6feb;
    --alert:#f85149; --alertbg:#2d1113; --warn:#d29922; --ok:#3fb950;
    --crit:#f85149; --high:#ff7b72; --med:#d29922; --low:#8b949e;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:12px; background:var(--panel); }
  header h1 { font-size:16px; margin:0; letter-spacing:.2px; }
  header .sub { color:var(--muted); font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:14px 16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns:1fr; gap:12px; }
  .row { display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center; }
  label { color:var(--muted); font-size:12px; display:flex; flex-direction:column; gap:4px; }
  label.inline { flex-direction:row; align-items:center; gap:6px; color:var(--fg); font-size:13px; }
  input[type=text], input[type=number], select {
    background:var(--bg); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:8px 10px; font:inherit; min-width:120px; }
  input#target { min-width:320px; }
  button { background:var(--accent2); color:#fff; border:0; border-radius:6px;
           padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent); }
  button:disabled { opacity:.55; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:500; }
  button.ctl { background:transparent; border:1px solid var(--line); color:var(--fg); font-weight:500; }
  button#stop-btn { border-color:#b4433a; color:#e06c62; }
  button#stop-btn:hover { background:#b4433a; color:#fff; }
  button.ghost:hover { background:var(--panel2); }
  #status { color:var(--muted); font-size:13px; min-height:18px; }
  #status.err { color:var(--alert); }
  #progress { margin:10px 0 2px; }
  #live-history { display:flex; flex-direction:column; gap:1px; margin-bottom:3px; }
  #live-history > div { color:var(--muted); opacity:.5; font-size:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #live-action { display:flex; align-items:center; gap:8px; color:var(--fg);
    font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .spin { width:12px; height:12px; flex:0 0 auto; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--accent);
    animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  .host-h { display:flex; align-items:baseline; gap:10px; margin:6px 0 10px; }
  .host-h .ip { font-size:15px; font-weight:600; }
  .host-h .meta { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line);
           vertical-align:top; font-size:13px; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .port { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px;
         background:var(--panel2); border:1px solid var(--line); color:var(--muted); }
  .conf-high { color:var(--ok); } .conf-medium { color:var(--warn); } .conf-low { color:var(--muted); }
  .scripts { margin:6px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px; }
  .scripts li { padding:6px 9px; border-radius:6px; background:var(--panel2);
                border-left:3px solid var(--line); font-size:12px; }
  .scripts li.alert { background:var(--alertbg); border-left-color:var(--alert); }
  .scripts li .id { font-weight:700; }
  .scripts li.alert .id { color:var(--alert); }
  .scripts li .id::after { content:" "; }
  .badge { font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; margin-left:6px; }
  .badge.alert { background:var(--alert); color:#fff; }
  .cves { margin:6px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; }
  .cves li { font-size:12px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .score { font-weight:700; font-variant-numeric:tabular-nums; min-width:34px; }
  .sev-CRITICAL,.score.CRITICAL { color:var(--crit); } .sev-HIGH,.score.HIGH { color:var(--high); }
  .sev-MEDIUM,.score.MEDIUM { color:var(--med); } .sev-LOW,.score.LOW { color:var(--low); }
  .kev { background:var(--alert); color:#fff; font-size:10px; font-weight:700; padding:0 5px; border-radius:3px; }
  .web { margin:6px 0 0; font-size:12px; color:var(--muted); }
  .web .lead { color:var(--accent); font-weight:600; }
  .web .secret { color:var(--alert); font-weight:700; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .web-head { cursor:default; }
  .web.has-items .web-head { cursor:pointer; }
  .web-body { display:none; margin:6px 0 2px 14px; }
  .web.web-open .web-body { display:block; }
  .web-sec-h { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; margin:8px 0 3px; }
  .web-list { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px; }
  .web-list li { font-size:12px; word-break:break-all; }
  .secrets li { display:flex; gap:7px; align-items:baseline; flex-wrap:wrap;
                padding:4px 8px; border-radius:5px; background:var(--panel2);
                border-left:3px solid var(--alert); }
  .secrets li .id { font-weight:700; }
  .sev-b { font-size:10px; font-weight:700; padding:0 5px; border-radius:3px; text-transform:uppercase; }
  .sev-b.high { background:var(--alert); color:#fff; }
  .sev-b.medium { background:var(--warn); color:#111; }
  .sev-b.low { background:var(--panel2); color:var(--muted); border:1px solid var(--line); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .empty { color:var(--muted); padding:20px; text-align:center; }
  .dl { display:flex; gap:10px; margin-top:10px; align-items:center; }
  /* while a scan runs the panel is visible but greyed + inert, so the operator
     sees the download controls exist yet knows they are not ready mid-scan */
  #downloads.pending { opacity:.5; }
  #downloads.pending button, #downloads.pending select { cursor:not-allowed; }
  /* saved-dir row: plain block so the [hidden] attribute always wins (no display override) */
  #saved-row { margin-top:10px; }
  #saved-row > * { margin-right:8px; vertical-align:middle; }
  code { background:var(--panel2); padding:2px 7px; border-radius:5px; font-size:12px; color:var(--fg); }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  /* accordion: one summary row per service, detail revealed on toggle */
  tr.svc { cursor:default; }
  tr.svc.toggle { cursor:pointer; }
  tr.svc.toggle:hover td { background:var(--panel2); }
  .caret { display:inline-block; width:12px; color:var(--muted); font-size:11px;
           margin-right:5px; user-select:none; }
  .summary { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin-top:5px; }
  .chip { font-size:11px; padding:1px 7px; border-radius:10px;
          background:var(--panel2); border:1px solid var(--line); color:var(--muted);
          white-space:nowrap; }
  .chip.sev-CRITICAL { color:var(--crit); border-color:var(--crit); }
  .chip.sev-HIGH { color:var(--high); border-color:var(--high); }
  .chip.sev-MEDIUM { color:var(--med); }
  .chip.alert { background:var(--alert); color:#fff; border-color:var(--alert); font-weight:700; }
  .chip.secret { color:var(--alert); border-color:var(--alert); font-weight:700; }
  .detail { display:none; }
  tr.svc.open .detail { display:block; }
</style>
</head>
<body>
<header>
  <h1>webrecon-ui</h1>
  <span class="sub">servicescan &mdash; service / version discovery + CVE &amp; exposure correlation</span>
</header>
<main>
  <div class="card">
    <form id="scan-form">
      <div class="row">
        <label>target(s)
          <input type="text" id="target" placeholder="10.0.0.5  example.com  192.168.1.0/24" autofocus>
        </label>
        <label>ports
          <input type="text" id="ports" placeholder="- (all) or 1-1000,8080">
        </label>
        <label>min CVSS
          <input type="number" id="min_cvss" min="0" max="10" step="0.1" value="0">
        </label>
        <label>nmap min-rate
          <input type="number" id="rate" min="0" step="1" placeholder="pkts/s">
        </label>
        <label>Kerberos realm
          <input type="text" id="realm" placeholder="CORP.LOCAL (TCP-88)">
        </label>
        <label>NSE scripts
          <input type="text" id="nse_scripts" placeholder="vuln (needs NSE on)">
        </label>
      </div>
      <div class="row">
        <label class="inline"><input type="checkbox" id="use_nmap" checked> use nmap</label>
        <label class="inline"><input type="checkbox" id="fingerprint" checked> fingerprint layer</label>
        <label class="inline"><input type="checkbox" id="fp_all"> fingerprint all ports</label>
        <label class="inline"><input type="checkbox" id="nse"> NSE scripts (nmap)</label>
        <label class="inline"><input type="checkbox" id="udp"> UDP (needs root)</label>
        <label class="inline"><input type="checkbox" id="cve" checked> CVE correlation</label>
        <label class="inline"><input type="checkbox" id="exploits"> map exploits</label>
        <label class="inline"><input type="checkbox" id="render"> render web roots (JS)</label>
        <label class="inline"><input type="checkbox" id="cam_creds" checked> camera default-cred test</label>
        <label class="inline"><input type="checkbox" id="save_to_disk"> save to disk</label>
      </div>
      <div class="row">
        <span class="muted" style="font-size:12px;">CVE sources:</span>
        <label class="inline"><input type="checkbox" id="nvd" checked> NVD</label>
        <label class="inline"><input type="checkbox" id="osv" checked> OSV</label>
        <label class="inline"><input type="checkbox" id="epss" checked> EPSS</label>
        <label class="inline"><input type="checkbox" id="kev" checked> KEV</label>
        <label>NVD API key
          <input type="text" id="nvd_api_key" placeholder="optional, raises rate limit">
        </label>
      </div>
      <div class="row">
        <label class="inline"><input type="checkbox" id="web"> web chain (crawl web ports)</label>
        <label class="inline"><input type="checkbox" id="web_render"> chain JS render</label>
        <label>depth
          <input type="number" id="web_depth" min="1" step="1" placeholder="1">
        </label>
        <label>max pages
          <input type="number" id="web_max_pages" min="1" step="1" placeholder="60">
        </label>
        <label>time budget s (0=∞)
          <input type="number" id="web_time_budget" min="0" step="any" value="300"
                 title="wall-clock cap per web port; 0 = no limit">
        </label>
      </div>
      <div class="row">
        <button type="submit" id="go">Scan</button>
        <button type="button" id="pause-btn" class="ctl" hidden>Pause</button>
        <button type="button" id="stop-btn" class="ctl" hidden>Stop</button>
        <span id="status"></span>
      </div>
    </form>
  </div>

  <div id="progress" hidden>
    <div id="live-history"></div>
    <div id="live-action"><span class="spin"></span><span id="live-text"></span></div>
  </div>

  <div id="results"></div>
  <div id="downloads" class="dl" hidden>
    <label class="inline">Download
      <select id="fmt">
        <option value="json">scan.json</option>
        <option value="sarif">scan.sarif</option>
        <option value="services-csv">services.csv</option>
        <option value="cves-csv">cves.csv</option>
        <option value="jsonl">scan.jsonl</option>
        <option value="html">report.html</option>
        <option value="nuclei-web">nuclei-targets.txt (web)</option>
        <option value="nuclei-net">nuclei-targets-net.txt</option>
        <option value="services-txt">services.txt</option>
        <option value="cves-txt">cves.txt</option>
      </select>
    </label>
    <button class="ghost" id="dl-go">Download</button>
    <button class="ghost" id="dl-all">Download all (zip)</button>
    <span id="dl-note" class="muted"></span>
  </div>
  <div id="saved-row" hidden>
    <span class="muted">Saved to</span>
    <code id="saved-path"></code>
    <button class="ghost" id="copy-path">Copy path</button>
    <button class="ghost" id="open-folder" title="opens on the machine running the server">Open folder</button>
    <span id="copy-note" class="muted"></span>
  </div>
</main>

<script>
"use strict";
let ALERT_IDS = new Set();
let scanId = null;
let lastOutdir = null;  // abs path of the on-disk scan dir (when "save to disk" was on)
let es = null;        // active EventSource (live scan stream)
let controlId = null; // scan_id of the in-flight scan, for pause/resume/stop
let scanPaused = false;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

async function loadAlertIds() {
  try {
    const r = await fetch("/api/alert-ids");
    if (r.ok) ALERT_IDS = new Set((await r.json()).alert_ids || []);
  } catch (_) { /* highlighting is best-effort */ }
}

function buildQuery() {
  const p = new URLSearchParams();
  p.set("target", $("target").value.trim());
  const ports = $("ports").value.trim();
  if (ports) p.set("ports", ports);
  p.set("use_nmap", $("use_nmap").checked);
  p.set("fingerprint", $("fingerprint").checked);
  p.set("fp_all", $("fp_all").checked);
  p.set("nse", $("nse").checked);
  if ($("nse").checked) {
    const ns = $("nse_scripts").value.trim();
    if (ns) p.set("nse_scripts", ns);
  }
  p.set("udp", $("udp").checked);
  p.set("cve", $("cve").checked);
  if ($("cve").checked) {            // CVE-source feeds only matter when CVE is on
    p.set("nvd", $("nvd").checked);
    p.set("osv", $("osv").checked);
    p.set("epss", $("epss").checked);
    p.set("kev", $("kev").checked);
    const key = $("nvd_api_key").value.trim();
    if (key) p.set("nvd_api_key", key);
  }
  p.set("exploits", $("exploits").checked);
  p.set("render", $("render").checked);
  p.set("cam_creds", $("cam_creds").checked);   // uncheck = fully passive camera recon
  if ($("save_to_disk").checked) p.set("save_to_disk", true);
  const mc = parseFloat($("min_cvss").value);
  if (!isNaN(mc) && mc > 0) p.set("min_cvss", mc);
  const rate = parseInt($("rate").value, 10);
  if (!isNaN(rate) && rate > 0) p.set("scan_rate", rate);
  const realm = $("realm").value.trim();
  if (realm) p.set("realm", realm);
  // --web crawl chain
  if ($("web").checked) {
    p.set("web", true);
    p.set("web_render", $("web_render").checked);
    const wd = parseInt($("web_depth").value, 10);
    if (!isNaN(wd) && wd > 0) p.set("web_depth", wd);
    const wm = parseInt($("web_max_pages").value, 10);
    if (!isNaN(wm) && wm > 0) p.set("web_max_pages", wm);
    const wt = parseFloat($("web_time_budget").value);
    if (!isNaN(wt) && wt >= 0) p.set("web_time_budget", wt);  // 0 = no limit
  }
  return p.toString();
}

function cveDispScore(c) {
  return (c.effective_cvss != null) ? c.effective_cvss : c.cvss;
}
function cveDispSev(c) {
  return c.effective_severity || c.severity || "";
}

// --- per-service expand/collapse state ------------------------------------
// Each service renders as one summary row; its scripts/CVEs/web detail is
// revealed on click. Exposure-ALERT services open by default (the dangerous
// ones are visible at a glance); the user can still collapse them. State is
// keyed by host:port so it survives the live re-renders (host/web-chain events).
const EXPANDED = new Set();   // user explicitly opened
const COLLAPSED = new Set();  // user explicitly closed
const svcKey = (ip, svc) => `${ip}:${svc.port}/${svc.proto}`;
function svcIsOpen(key, hasAlert) {
  if (EXPANDED.has(key)) return true;
  if (COLLAPSED.has(key)) return false;
  return hasAlert;            // default: alerts open, everything else closed
}
function applySvcState(tr, open, caret) {
  tr.classList.toggle("open", open);
  if (caret) caret.textContent = open ? "▾" : "▸";
}
function toggleSvc(key, hasAlert, tr, caret) {
  const open = svcIsOpen(key, hasAlert);
  if (open) { COLLAPSED.add(key); EXPANDED.delete(key); }
  else { EXPANDED.add(key); COLLAPSED.delete(key); }
  applySvcState(tr, !open, caret);
}

const SEV_RANK = { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1, "": 0 };

function renderService(svc, hostIp) {
  const tr = el("tr", "svc");
  const idv = [svc.product, svc.version].filter(Boolean).join(" ") || svc.name || "—";

  const cves = (svc.cves || []).slice().sort((a, b) => (cveDispScore(b) || 0) - (cveDispScore(a) || 0));
  const scripts = svc.scripts || [];
  const hasAlert = scripts.some((sc) => ALERT_IDS.has(sc.id));
  const hasWeb = !!(svc.web && svc.web.url);
  const hasDetail = cves.length || scripts.length || hasWeb;
  const key = svcKey(hostIp, svc);

  // -- port cell (with a caret when there's a detail block to toggle) --
  const portTd = el("td", "port");
  const caret = el("span", "caret", hasDetail ? "▸" : "");
  portTd.appendChild(caret);
  portTd.appendChild(document.createTextNode(`${svc.port}/${svc.proto}`));
  tr.appendChild(portTd);

  tr.appendChild(el("td", null, svc.name || "—"));

  // -- service / findings cell: ident + always-visible summary + detail --
  const idTd = el("td");
  const ident = el("div");
  ident.appendChild(el("span", null, idv));
  if (svc.extrainfo) { ident.appendChild(document.createTextNode(" ")); ident.appendChild(el("span", "muted", "· " + svc.extrainfo)); }
  const pageTitle = svc.http && svc.http.title;
  if (pageTitle) { ident.appendChild(document.createTextNode(" ")); ident.appendChild(el("span", "muted", '· "' + pageTitle + '"')); }
  idTd.appendChild(ident);

  // summary chips (compact counts, shown whether or not the row is expanded)
  if (hasDetail) {
    const sum = el("div", "summary");
    if (cves.length) {
      let maxSev = "";
      for (const c of cves) { const s = cveDispSev(c); if ((SEV_RANK[s] || 0) > (SEV_RANK[maxSev] || 0)) maxSev = s; }
      const label = `${cves.length} CVE${cves.length > 1 ? "s" : ""}` + (maxSev ? ` · ${maxSev}` : "");
      sum.appendChild(Object.assign(el("span", "chip sev-" + maxSev), { textContent: label }));
      const kev = cves.filter((c) => c.kev).length;
      if (kev) sum.appendChild(Object.assign(el("span", "chip secret"), { textContent: `${kev} KEV` }));
    }
    if (scripts.length)
      sum.appendChild(Object.assign(el("span", "chip" + (hasAlert ? " alert" : "")),
        { textContent: `${scripts.length} script${scripts.length > 1 ? "s" : ""}` + (hasAlert ? " · ALERT" : "") }));
    if (hasWeb) {
      const w = svc.web;
      sum.appendChild(Object.assign(el("span", "chip" + (w.secrets ? " secret" : "")),
        { textContent: w.secrets ? `web · ${w.secrets} secrets` : `web · ${w.pages || 0} pages` }));
    }
    idTd.appendChild(sum);
  }

  // detail block (hidden unless the row is open)
  const detail = el("div", "detail");

  if (scripts.length) {
    const ul = el("ul", "scripts");
    for (const sc of scripts) {
      const isAlert = ALERT_IDS.has(sc.id);
      const li = el("li", isAlert ? "alert" : null);
      li.appendChild(Object.assign(el("span", "id"), { textContent: sc.id }));
      li.appendChild(document.createTextNode(sc.output || ""));
      if (isAlert) li.appendChild(Object.assign(el("span", "badge alert"), { textContent: "ALERT" }));
      ul.appendChild(li);
    }
    detail.appendChild(ul);
  }

  if (cves.length) {
    const ul = el("ul", "cves");
    for (const c of cves) {
      const sev = cveDispSev(c), score = cveDispScore(c);
      const li = el("li");
      li.appendChild(Object.assign(el("span", "score " + sev), { textContent: (score != null ? score.toFixed(1) : "—") }));
      const a = el("a", null, c.id); a.href = c.url || "#"; a.target = "_blank"; a.rel = "noopener";
      li.appendChild(a);
      if (c.kev) li.appendChild(Object.assign(el("span", "kev"), { textContent: "KEV" }));
      if (c.epss_pct != null) li.appendChild(Object.assign(el("span", "muted"), { textContent: `EPSS ${(c.epss_pct * 100).toFixed(0)}%` }));
      if (c.summary || c.env_note) {
        const s = el("span", "muted", (c.env_note ? c.env_note + " " : "") + (c.summary || "").slice(0, 140));
        li.appendChild(s);
      }
      ul.appendChild(li);
    }
    detail.appendChild(ul);
  }

  if (hasWeb) {
    const w = svc.web;
    const wrap = el("div", "web");
    const secList = w.secret_list || [], epList = w.endpoint_list || [],
          paramList = w.param_list || [];
    const hasItems = secList.length || epList.length || paramList.length;
    if (hasItems) wrap.classList.add("has-items");

    // counts header — click to expand the actual items below (like the
    // service-row accordion; the full set is in the saved output tree).
    const head = el("div", "web-head");
    head.appendChild(el("span", "caret", hasItems ? "▸" : ""));
    head.appendChild(Object.assign(el("span", "lead"), { textContent: "web chain → " }));
    const bits = [`${w.pages || 0} pages`, `${w.urls || 0} urls`,
                  `${w.endpoints || 0} endpoints`, `${w.params || 0} params`];
    head.appendChild(document.createTextNode(bits.join(" · ")));
    if (w.secrets) {
      head.appendChild(document.createTextNode(" · "));
      head.appendChild(Object.assign(el("span", "secret"), { textContent: `${w.secrets} secrets` }));
    }
    if (w.vhosts && w.vhosts.length)
      head.appendChild(document.createTextNode(` · ${w.vhosts.length} vhosts`));
    if (w.tech && w.tech.length)
      head.appendChild(document.createTextNode(" · tech: " + w.tech.slice(0, 6).join(", ")));
    wrap.appendChild(head);

    if (hasItems) {
      const body = el("div", "web-body");
      // secrets first (operator priority); values shown unredacted, as on disk
      if (secList.length) {
        body.appendChild(el("div", "web-sec-h", `secrets (${w.secrets})`));
        const ul = el("ul", "web-list secrets");
        for (const s of secList) {
          const li = el("li");
          li.appendChild(Object.assign(el("span", "sev-b " + (s.severity || "low")),
            { textContent: s.severity || "?" }));
          li.appendChild(Object.assign(el("span", "id"), { textContent: s.type || "secret" }));
          li.appendChild(Object.assign(el("span", "mono"), { textContent: (s.match_preview || "").slice(0, 80) }));
          if (s.source) li.appendChild(Object.assign(el("span", "muted"), { textContent: "· " + s.source }));
          ul.appendChild(li);
        }
        if (w.secrets > secList.length)
          ul.appendChild(Object.assign(el("li", "muted"), { textContent: `+ ${w.secrets - secList.length} more (in saved output)` }));
        body.appendChild(ul);
      }
      if (epList.length) {
        body.appendChild(el("div", "web-sec-h", `endpoints (${w.endpoints})`));
        const ul = el("ul", "web-list");
        for (const e of epList) ul.appendChild(Object.assign(el("li", "mono"), { textContent: e }));
        if (w.endpoints > epList.length)
          ul.appendChild(Object.assign(el("li", "muted"), { textContent: `+ ${w.endpoints - epList.length} more` }));
        body.appendChild(ul);
      }
      if (paramList.length) {
        body.appendChild(el("div", "web-sec-h", `params (${w.params})`));
        const ul = el("ul", "web-list");
        for (const p of paramList) {
          const li = el("li", "mono");
          li.appendChild(document.createTextNode(p.ep || ""));
          if (p.names && p.names.length)
            li.appendChild(Object.assign(el("span", "muted"), { textContent: "  " + p.names.join(", ") }));
          ul.appendChild(li);
        }
        if (w.params > paramList.length)
          ul.appendChild(Object.assign(el("li", "muted"), { textContent: `+ ${w.params - paramList.length} more` }));
        body.appendChild(ul);
      }
      wrap.appendChild(body);

      head.addEventListener("click", (ev) => {
        ev.stopPropagation();            // don't toggle the parent service row
        const open = wrap.classList.toggle("web-open");
        head.querySelector(".caret").textContent = open ? "▾" : "▸";
      });
    }
    detail.appendChild(wrap);
  }
  idTd.appendChild(detail);
  tr.appendChild(idTd);

  tr.appendChild(Object.assign(el("td", "conf-" + (svc.confidence || "low")), { textContent: svc.confidence || "low" }));
  tr.appendChild(el("td", "muted", (svc.sources || []).join("+")));

  // wire the toggle (only when there's something to reveal)
  if (hasDetail) {
    tr.classList.add("toggle");
    applySvcState(tr, svcIsOpen(key, hasAlert), caret);
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;   // let CVE links through
      toggleSvc(key, hasAlert, tr, caret);
    });
  }
  return tr;
}

function render(result) {
  const root = $("results");
  root.innerHTML = "";
  const hosts = result.hosts || [];
  const nsvc = hosts.reduce((n, h) => n + (h.services || []).length, 0);
  if (!hosts.length || !nsvc) {
    root.appendChild(Object.assign(el("div", "card empty"),
      { textContent: "No open services found." + (result.errors && result.errors.length ? " (" + result.errors.join("; ") + ")" : "") }));
    return;
  }
  for (const h of hosts) {
    const card = el("div", "card");
    const hh = el("div", "host-h");
    const label = (h.hostname && h.ip && h.hostname !== h.ip) ? `${h.hostname} (${h.ip})` : (h.ip || h.hostname || h.target);
    hh.appendChild(Object.assign(el("span", "ip"), { textContent: label }));
    hh.appendChild(Object.assign(el("span", "meta"), { textContent: `${(h.services || []).length} open service(s)` }));
    card.appendChild(hh);

    const table = el("table");
    const thead = el("thead"), htr = el("tr");
    for (const c of ["Port", "Name", "Service / findings", "Conf", "Src"]) htr.appendChild(el("th", null, c));
    thead.appendChild(htr); table.appendChild(thead);
    const tb = el("tbody");
    for (const svc of (h.services || [])) tb.appendChild(renderService(svc, h.ip || h.hostname || h.target));
    table.appendChild(tb);
    card.appendChild(table);
    root.appendChild(card);
  }
}

function setStatus(msg, isErr) {
  const s = $("status"); s.textContent = msg; s.className = isErr ? "err" : "";
}

// The export endpoints work off the cached, COMPLETED ScanResult, which the
// server only mints (with a scan_id) after the whole scan -- web chain included
// -- finishes. So during a scan there is nothing to download. Rather than hide
// the controls (operator clicks a missing/dead button and thinks it's broken),
// show them greyed + disabled with a hint, and enable them on completion.
function setDownloadsState(state) {   // "hidden" | "pending" | "ready"
  const dl = $("downloads");
  if (state === "hidden") { dl.hidden = true; dl.classList.remove("pending"); return; }
  dl.hidden = false;
  const pending = state === "pending";
  dl.classList.toggle("pending", pending);
  for (const c of [$("dl-go"), $("dl-all"), $("fmt")]) c.disabled = pending;
  $("dl-note").textContent = pending ? "available when the scan finishes" : "";
}

// High-level "what is the scan doing right now" line. The SSE stream emits a
// {type:"phase"} tick at each sub-phase boundary (nmap / fingerprint / exposure
// / render / cve / web); between the coarse host milestones these are the only
// sign of life during long stretches (CVE correlation especially). We surface
// the current phase on a spinner line, with the few previous ones dimmed above.
const PHASE_LABELS = {
  nmap:        () => "Scanning ports (nmap) …",
  fingerprint: (h) => `${h} · fingerprinting services …`,
  exposure:    (h) => `${h} · checking for exposed services …`,
  render:      (h) => `${h} · rendering web pages …`,
  cve:         (h) => `${h} · correlating CVEs (NVD / OSV) …`,
  web:         () => "Web chain · handing web ports to webrecon …",
};
function phaseText(msg) {
  const f = PHASE_LABELS[msg.phase];
  return f ? f(msg.host || "") : null;
}
function pushPhase(text) {
  if (!text) return;
  const hist = $("live-history");
  const cur = $("live-text").textContent;
  if (cur) {
    const line = document.createElement("div");
    line.textContent = cur;
    hist.prepend(line);
    while (hist.children.length > 3) hist.removeChild(hist.lastChild);
  }
  $("live-text").textContent = text;
  $("progress").hidden = false;
}
function clearProgress() {
  $("progress").hidden = true;
  $("live-history").innerHTML = "";
  $("live-text").textContent = "";
}

async function fetchAndSave(fmt, fallbackName) {
  if (!scanId) return;
  const note = $("dl-note"); note.textContent = "";
  try {
    const r = await fetch(`/api/export/${scanId}/${encodeURIComponent(fmt)}`);
    if (!r.ok) {
      let msg = String(r.status);
      try { msg = (await r.json()).error || msg; } catch (_) {}
      note.textContent = "— " + msg;
      return;
    }
    const blob = await r.blob();
    const cd = r.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const fname = m ? m[1] : fallbackName;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { note.textContent = "— " + e.message; }
}
function doExport() { fetchAndSave($("fmt").value, $("fmt").value + ".txt"); }
function doExportAll() { fetchAndSave("all", "scan.zip"); }

async function copyPath() {
  if (!lastOutdir) return;
  const note = $("copy-note");
  try {
    await navigator.clipboard.writeText(lastOutdir);
    note.textContent = "copied";
  } catch (_) {
    note.textContent = "select & copy manually";   // clipboard blocked (non-secure ctx)
  }
  setTimeout(() => { note.textContent = ""; }, 1800);
}

// Open the saved folder in the file manager OF THE MACHINE RUNNING THE SERVER
// (only useful when that's this machine). The X-Requested-With header is what
// lets the server tell this same-origin call apart from a drive-by cross-site POST.
async function openFolder() {
  if (!scanId) return;
  const note = $("copy-note"); note.textContent = "";
  try {
    const r = await fetch("/api/reveal", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "webrecon-ui" },
      body: JSON.stringify({ scan_id: scanId }),
    });
    if (!r.ok) {
      let msg = String(r.status);
      try { msg = (await r.json()).error || msg; } catch (_) {}
      note.textContent = "— " + msg;
    } else {
      note.textContent = "opened on the server host";
      setTimeout(() => { note.textContent = ""; }, 1800);
    }
  } catch (e) { note.textContent = "— " + e.message; }
}

// --- pause / resume / stop controls for a live scan -----------------------
function showScanControls(on) {
  const p = $("pause-btn"), s = $("stop-btn");
  p.hidden = !on; s.hidden = !on;
  p.disabled = false; s.disabled = false;
  p.textContent = "Pause";
  scanPaused = false;
}

async function sendScanControl(action) {
  if (!controlId) return null;
  try {
    const r = await fetch("/api/scan/" + controlId + "/" + action, {
      method: "POST",
      headers: { "X-Requested-With": "webrecon-ui" },
    });
    if (!r.ok) return null;
    return await r.json();
  } catch (_) { return null; }
}

async function togglePause() {
  if (!controlId) return;
  if (!scanPaused) {
    const s = await sendScanControl("pause");
    if (s && s.state === "paused") {
      scanPaused = true;
      $("pause-btn").textContent = "Resume";
      setStatus("Paused — resume to continue, or stop for partial results.");
    }
  } else {
    const s = await sendScanControl("resume");
    if (s && s.state === "running") {
      scanPaused = false;
      $("pause-btn").textContent = "Pause";
      setStatus("Resumed …");
    }
  }
}

async function stopScan() {
  if (!controlId) return;
  $("stop-btn").disabled = true;
  $("pause-btn").disabled = true;
  setStatus("Stopping … (finishing the current step, then returning partial results)");
  // the scan ends on its own with a 'done' event carrying stopped=true
  await sendScanControl("stop");
}

function endScan() {
  if (es) { es.close(); es = null; }
  $("go").disabled = false;
  showScanControls(false);
  controlId = null;
  clearProgress();
}

// Live scan over Server-Sent Events: hosts render as each one finishes, instead
// of the page blocking until the whole scan completes.
function doScan(ev) {
  ev.preventDefault();
  const target = $("target").value.trim();
  if (!target) { setStatus("Enter a target.", true); return; }
  if (es) { es.close(); es = null; }
  $("go").disabled = true;
  setDownloadsState("pending");         // visible but greyed until the scan ends
  $("results").innerHTML = "";
  EXPANDED.clear(); COLLAPSED.clear();   // fresh expand/collapse state per scan
  lastOutdir = null; $("saved-row").hidden = true;   // clear prior save-to-disk path
  clearProgress();                                   // fresh live-phase panel
  controlId = null; showScanControls(false);         // controls appear on 'accepted'
  const hosts = [];
  let expected = null;
  const t0 = Date.now();
  setStatus("Scanning " + target + " …");

  es = new EventSource("/api/scan/stream?" + buildQuery());
  es.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (msg.type === "accepted") {
      // scan id handed out up front -> enable the pause/stop controls
      controlId = msg.scan_id || null;
      if (controlId) showScanControls(true);
    } else if (msg.type === "phase") {
      pushPhase(phaseText(msg));
    } else if (msg.type === "start") {
      expected = msg.nhosts;
      setStatus(expected
        ? `Scanning ${target} … ${expected} host(s) with open ports`
        : `Scanning ${target} … (no open ports yet)`);
    } else if (msg.type === "host") {
      hosts.push(msg.host);
      render({ hosts });                       // incremental re-render
      const done = hosts.length + (expected ? "/" + expected : "");
      setStatus(`Scanning ${target} … ${done} host(s) done`);
    } else if (msg.type === "update") {
      // web chain enriched the hosts after their first render; replace them
      hosts.length = 0;
      for (const h of (msg.hosts || [])) hosts.push(h);
      render({ hosts });
      setStatus(`Scanning ${target} … web chain done`);
    } else if (msg.type === "done") {
      scanId = msg.scan_id || null;
      if (!hosts.length) render({ hosts: [], errors: msg.errors });
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      const ns = hosts.reduce((n, h) => n + (h.services || []).length, 0);
      const verb = msg.stopped ? "Stopped" : "Done";
      const tail = msg.stopped ? " (partial — stopped by request)" : (msg.nmap_used ? " (nmap)" : "");
      setStatus(`${verb} in ${secs}s — ${ns} service(s) across ${hosts.length} host(s)${tail}.`);
      setDownloadsState(scanId ? "ready" : "hidden");
      if (msg.outdir) {
        lastOutdir = msg.outdir;
        $("saved-path").textContent = msg.outdir;
        $("saved-row").hidden = false;
      } else if (msg.outdir_error) {
        $("dl-note").textContent = "— save to disk failed: " + msg.outdir_error;
      }
      endScan();
    } else if (msg.type === "error") {
      setStatus("Error: " + (msg.error || "scan failed"), true);
      setDownloadsState("hidden");             // no result was cached
      endScan();
    }
  };
  es.onerror = () => {
    if (!es) return;                           // normal close after 'done'
    setStatus("Stream interrupted.", true);
    setDownloadsState("hidden");               // no scan_id -> nothing to export
    endScan();
  };
}

$("scan-form").addEventListener("submit", doScan);
$("pause-btn").addEventListener("click", togglePause);
$("stop-btn").addEventListener("click", stopScan);
$("dl-go").addEventListener("click", doExport);
$("dl-all").addEventListener("click", doExportAll);
$("copy-path").addEventListener("click", copyPath);
$("open-folder").addEventListener("click", openFolder);
loadAlertIds();
</script>
</body>
</html>
